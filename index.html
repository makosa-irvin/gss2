<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      No static <title>/<meta name="description"> here on purpose: every
      route renders its own <PageMeta> (src/components/common/PageMeta.tsx)
      via React 19's built-in head-hoisting the instant it mounts. Keeping
      a static fallback tag here would sit alongside - not get replaced
      by - the React-rendered one, since React only manages tags it
      renders itself. Two description tags on one page is invalid HTML
      and leaves crawlers to guess which one is authoritative, so there
      must be exactly one source of truth. The trade-off: a crawler or
      link-preview bot that doesn't execute JavaScript will briefly see no
      description before the first paint. If that becomes a problem,
      the real fix is prerendering/SSR, not adding tags back here.
    -->
    <title>Good Secrets Safaris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-[#0c120e] text-[#f4f2eb] antialiased selection:bg-[#c49a45] selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
