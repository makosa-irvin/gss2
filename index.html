<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      No static <title>/<meta name="description"> here on purpose: every
      route renders its own <PageMeta> (src/components/common/PageMeta.tsx)
      via React 19's built-in head-hoisting the instant it mounts. Keeping
      a static fallback tag here would sit alongside - not get replaced
      by - the React-rendered one, since React only manages tags it
      renders itself. Two description tags on one page is invalid HTML
      and leaves crawlers to guess which one is authoritative, so there
      must be exactly one source of truth. The trade-off: a crawler or
      link-preview bot that doesn't execute JavaScript will briefly see no
      description before the first paint. If that becomes a problem,
      the real fix is prerendering/SSR, not adding tags back here.
    -->
    <title>Good Secrets Safaris</title>
    <!--
      Fonts are now self-hosted (see src/index.css, @fontsource-variable
      imports) rather than loaded from Google Fonts. That removed a
      render-blocking third-party stylesheet request (~410ms per
      Lighthouse) and, more importantly, the network waterfall it
      created: the actual .woff2 files couldn't start downloading until
      that separate CSS response came back and was parsed. Self-hosting
      lets Vite bundle+fingerprint the font CSS with the rest of the
      app's CSS, so the font files are discoverable and start
      downloading immediately.
    -->
    <!--
      Preconnect to the API origin: it was flagged as a ~630ms preconnect
      opportunity (network-dependency-tree-insight) since every page's
      catalog data comes from here.
    -->
    <link rel="preconnect" href="https://good-secrets-safaris-staging-production.up.railway.app">
    <!--
      Preload the hero background image referenced in HomePage.tsx. It's
      not the LCP element (that's the H1 text), but it's a large
      above-the-fold visual and was otherwise only discoverable once
      React mounted and rendered the <img> tag - preloading it from the
      HTML lets the browser start the fetch immediately, in parallel
      with the JS bundle. If the hero image URL in HomePage.tsx ever
      changes, update this href to match.
    -->
    <link
      rel="preload"
      as="image"
      href="/images/catalog/vehicle-next-to-the-great-migration.jpg"
      fetchpriority="high"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-[#0c120e] text-[#f4f2eb] antialiased selection:bg-[#c49a45] selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
