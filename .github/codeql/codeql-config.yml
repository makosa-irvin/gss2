name: "Good Secrets Safaris CodeQL config"

# js/missing-token-validation ("Missing CSRF middleware") only recognizes
# token-based CSRF middleware (csurf/lusca) and flags any cookie-parser
# usage feeding a state-changing handler without one. This server's API is
# JSON-only (no HTML forms, so there's nothing for a forged <form> POST to
# submit), and every route - via app.use(requireTrustedOrigin) in
# server/src/app.ts - already rejects any cookie-authenticated,
# state-changing request whose Origin header isn't on the explicit
# CORS_ORIGINS allowlist. That's OWASP's own "Verifying Origin with
# Standard Headers" CSRF defense; a token library would duplicate it
# without closing any gap it doesn't already close. Because
# requireTrustedOrigin is mounted globally, this is a standing
# architectural mitigation, not a per-route exception, so it's excluded
# here rather than re-litigated with an inline suppression comment on
# every route handler the query happens to flag.
query-filters:
  - exclude:
      id: js/missing-token-validation
