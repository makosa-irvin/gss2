name: Bug report
description: Report a reproducible problem in the website, API, admin CRM, or deployment.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Public website
        - Enquiry flow
        - Admin CRM
        - Backend/API
        - Database
        - Deployment/CI
        - SEO/accessibility/performance
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: URL/branch, browser/device, and any relevant environment details. Never paste secrets.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Add relevant screenshots or sanitized logs.
